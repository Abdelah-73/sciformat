<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciFormat - Universal Academic Code & Math Formatter</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Prism.js لتنسيق الأكواد وتلوين الألفاظ -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet" />

    <!-- KaTeX للمعادلات -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- html2canvas للتحميل كصورة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- js-beautify لتنسيق المسافات والأسطر لجميع اللغات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-css.min.js"></script>

    <style>
        .code-force-ltr {
            direction: ltr !important;
            text-align: left !important;
            unicode-bidi: isolate !important;
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace !important;
            tab-size: 4;
        }
        #mathRendered, .katex-display {
            direction: ltr !important;
            text-align: center !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans transition-all duration-300">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">SciFormat 🎓</h1>
            
            <div class="flex items-center gap-3">
                <span data-i18n="badge" class="text-xs md:text-sm bg-indigo-700 px-3 py-1 rounded-full hidden sm:inline">أداة الطلاب والباحثين المجانية</span>
                
                <select id="uiLangSelect" onchange="changeUILanguage(this.value)" class="bg-indigo-800 text-white text-xs md:text-sm px-3 py-1.5 rounded-lg border border-indigo-500 font-semibold outline-none cursor-pointer">
                    <option value="ar" selected>🌐 العربية</option>
                    <option value="en">🌐 English</option>
                    <option value="fr">🌐 Français</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-4 space-y-8">
        
        <!-- Section 1: Universal Code Formatter -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-2">
                <div>
                    <h2 data-i18n="codeTitle" class="text-xl font-bold text-indigo-900">1. مُنسّق الأكواد البرمجية الشامل (Word & Docs Ready)</h2>
                    <p data-i18n="codeDesc" class="text-slate-600 text-sm">أدخل الكود وسيتم تفكيكه وتلوين ألوانه وضبط مسافاته فوراً لنقله بضغطة زر لـ Word.</p>
                </div>
                
                <div class="flex flex-wrap items-center gap-2">
                    <label class="flex items-center gap-1 text-sm font-semibold cursor-pointer bg-slate-100 px-2 py-1.5 rounded border">
                        <input type="checkbox" id="lineNumbersToggle" onchange="processAndHighlight()" checked class="accent-indigo-600">
                        <span data-i18n="lineNums">ترقيم الأسطر</span>
                    </label>

                    <select id="languageSelect" onchange="processAndHighlight()" class="p-2 border rounded-lg bg-slate-100 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="cpp">C / C++</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="javascript">JavaScript</option>
                        <option value="csharp">C#</option>
                        <option value="html">HTML / Markup</option>
                        <option value="css">CSS</option>
                        <option value="sql">SQL</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Input Box -->
                <div>
                    <label data-i18n="originalCode" class="block text-sm font-semibold mb-2">الكود الأصلي (انسخ الكود هنا):</label>
                    <textarea id="codeInput" oninput="processAndHighlight()" class="code-force-ltr w-full h-80 p-3 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50" placeholder="// Paste your code here..."></textarea>
                </div>

                <!-- Preview Output Box -->
                <div>
                    <label data-i18n="previewTitle" class="block text-sm font-semibold mb-2">المعاينة والتلوين النظيف:</label>
                    <div id="codePreviewContainer" class="code-force-ltr w-full h-80 p-3 border rounded-lg overflow-auto bg-[#2d2d2d] text-white text-sm">
                        <pre id="preContainer" class="line-numbers code-force-ltr m-0 p-0"><code id="codePreview" class="code-force-ltr">// Preview...</code></pre>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-4 flex flex-wrap gap-3 items-center justify-between">
                <div class="flex gap-2">
                    <button onclick="beautifyCode()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
                        ✨ <span data-i18n="btnFormat">تنسيق وضبط المسافات تلقائياً</span>
                    </button>
                    <button onclick="downloadCodeImage()" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
                        🖼️ <span data-i18n="btnDownloadImage">تحميل الكود كصورة</span>
                    </button>
                </div>
                <button onclick="copyFormattedCode()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2 rounded-lg transition text-sm">
                    📋 <span data-i18n="btnCopy">نسخ للتثبيت في Word مباشرة</span>
                </button>
            </div>
        </div>

        <!-- Section 2: LaTeX Math Converter -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 data-i18n="mathTitle" class="text-xl font-bold mb-2 text-indigo-900">2. محول معادلات LaTeX إلى تنسيق معروض</h2>
            <div class="space-y-4">
                <div>
                    <label data-i18n="latexLabel" class="block text-sm font-semibold mb-2">صيغة LaTeX:</label>
                    <input type="text" id="latexInput" oninput="renderMath()" value="A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}, \quad \det(A) = ad - bc" class="code-force-ltr w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                </div>

                <div class="p-6 border rounded-lg bg-slate-50 flex justify-center items-center">
                    <div id="mathRendered" dir="ltr" class="bg-white p-4 rounded text-2xl text-slate-900 inline-block shadow-sm"></div>
                </div>

                <div class="flex flex-wrap gap-3 justify-between items-center">
                    <button onclick="downloadMathImage()" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
                        🖼️ <span data-i18n="btnDownloadMathImage">حفظ المعادلة فقط كصورة</span>
                    </button>
                    <button onclick="renderMath()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-lg transition text-sm">
                        🧮 <span data-i18n="btnRenderMath">معالجة المعادلة</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Prism Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

    <script>
        const translations = {
            ar: {
                dir: 'rtl',
                badge: 'أداة الطلاب والباحثين المجانية',
                codeTitle: '1. مُنسّق الأكواد البرمجية الشامل (Word & Docs Ready)',
                codeDesc: 'أدخل الكود وسيتم تفكيكه وتلوين ألوانه وضبط مسافاته فوراً لنقله بضغطة زر لـ Word.',
                lineNums: 'ترقيم الأسطر',
                originalCode: 'الكود الأصلي (انسخ الكود هنا):',
                previewTitle: 'المعاينة والتلوين النظيف:',
                btnFormat: 'تنسيق وضبط المسافات تلقائياً',
                btnDownloadImage: 'تحميل الكود كصورة',
                btnCopy: 'نسخ للتثبيت في Word مباشرة',
                copyAlert: 'تم نسخ الكود بنجاح! انسخه الآن داخل Microsoft Word.',
                mathTitle: '2. محول معادلات LaTeX إلى تنسيق معروض',
                latexLabel: 'صيغة LaTeX:',
                btnRenderMath: 'معالجة المعادلة',
                btnDownloadMathImage: 'حفظ المعادلة كصورة'
            },
            en: {
                dir: 'ltr',
                badge: 'Free Academic Tool',
                codeTitle: '1. Universal Code Formatter (Word & Docs Ready)',
                codeDesc: 'Format, beautify and highlight syntax for Microsoft Word seamlessly.',
                lineNums: 'Line Numbers',
                originalCode: 'Original Code:',
                previewTitle: 'Formatted Preview:',
                btnFormat: 'Auto Format & Beautify',
                btnDownloadImage: 'Export as PNG Image',
                btnCopy: 'Copy for MS Word',
                copyAlert: 'Code copied! Paste directly into Microsoft Word.',
                mathTitle: '2. LaTeX Equation Renderer',
                latexLabel: 'LaTeX Formula:',
                btnRenderMath: 'Render Equation',
                btnDownloadMathImage: 'Export Formula as Image'
            },
            fr: {
                dir: 'ltr',
                badge: 'Outil académique gratuit',
                codeTitle: '1. Formateur de code universel (Prêt pour Word)',
                codeDesc: 'Formatez et colorez votre code pour MS Word en un clic.',
                lineNums: 'Numéros de ligne',
                originalCode: 'Code Original:',
                previewTitle: 'Aperçu structuré:',
                btnFormat: 'Formater automatiquement',
                btnDownloadImage: 'Exporter en PNG',
                btnCopy: 'Copier pour MS Word',
                copyAlert: 'Code copié! Collez-le dans Word.',
                mathTitle: '2. Convertisseur d’équations LaTeX',
                latexLabel: 'Formule LaTeX:',
                btnRenderMath: 'Rendre l’équation',
                btnDownloadMathImage: 'Exporter la formule en PNG'
            }
        };

        let currentLang = 'ar';

        function changeUILanguage(langKey) {
            currentLang = langKey;
            const langData = translations[langKey];

            document.getElementById('htmlTag').setAttribute('dir', langData.dir);
            document.getElementById('htmlTag').setAttribute('lang', langKey);

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (langData[key]) {
                    element.textContent = langData[key];
                }
            });
        }

        // خوارزمية ذكية لتنسيق وفك الأسطر والمسافات
        function formatLogic(code) {
            if (!code) return '';
            let c = code
                .replace(/(#include\s*<[^>]+>)/g, '$1\n')
                .replace(/;\s*/g, ';\n')
                .replace(/\{\s*/g, ' {\n')
                .replace(/\}\s*/g, '\n}\n');

            let lines = c.split('\n');
            let indent = 0;
            let out = [];

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                if (line.startsWith('}')) indent = Math.max(0, indent - 1);
                out.push('    '.repeat(indent) + line);
                if (line.endsWith('{')) indent++;
            }
            return out.join('\n');
        }

        function beautifyCode() {
            const input = document.getElementById('codeInput');
            const lang = document.getElementById('languageSelect').value;
            
            if (lang === 'html' || lang === 'css' || lang === 'javascript') {
                if (window.js_beautify) {
                    input.value = js_beautify(input.value, { indent_size: 4 });
                }
            } else {
                input.value = formatLogic(input.value);
            }
            processAndHighlight();
        }

        function processAndHighlight() {
            const input = document.getElementById('codeInput').value;
            const lang = document.getElementById('languageSelect').value;
            const preview = document.getElementById('codePreview');
            const preContainer = document.getElementById('preContainer');
            const showLineNums = document.getElementById('lineNumbersToggle').checked;

            if (showLineNums) {
                preContainer.classList.add('line-numbers');
            } else {
                preContainer.classList.remove('line-numbers');
            }

            preview.className = `language-${lang} code-force-ltr`;
            preview.textContent = input || '// أدخل الكود هنا...';

            if (window.Prism) {
                Prism.highlightElement(preview);
            }
        }

        function downloadCodeImage() {
            const element = document.getElementById('preContainer');
            html2canvas(element, { backgroundColor: '#2d2d2d' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'formatted-code.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function downloadMathImage() {
            const element = document.getElementById('mathRendered');
            html2canvas(element, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'math-equation.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function copyFormattedCode() {
            const container = document.getElementById('codePreviewContainer');
            const range = document.createRange();
            range.selectNode(container);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            alert(translations[currentLang].copyAlert);
        }

        function renderMath() {
            const input = document.getElementById('latexInput').value;
            const target = document.getElementById('mathRendered');
            try {
                katex.render(input, target, {
                    throwOnError: false,
                    displayMode: true
                });
            } catch (e) {
                target.innerText = "Error in LaTeX formula";
            }
        }

        window.onload = function() {
            document.getElementById('codeInput').value = `#include <iostream>#include <vector>#include <string>\nint main(){int x=10;double y=20.5;std::vector<std::string>list={"C++","Python","Java"};for(int i=0;i<3;i++){if(x<y){std::cout<<"Item: "<<list[i]<<" | Value: "<<x*i<<std::endl;}else{std::cout<<"Error"<<std::endl;}}return 0;}`;
            processAndHighlight();
            renderMath();
        };
    </script>
</body>
</html>
